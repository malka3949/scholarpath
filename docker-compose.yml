services:
  postgres:
    image: postgres:16-alpine
    container_name: scholarpath-db
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: scholarpath
      POSTGRES_PASSWORD: scholarpath
      POSTGRES_DB: scholarpath
    volumes:
      - scholarpath_pgdata:/var/lib/postgresql/data

volumes:
  scholarpath_pgdata:
